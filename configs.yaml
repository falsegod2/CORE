defaults:
  # ==========================================
  # 1. 系统与日志配置 (System & Logging)
  # ==========================================
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0

  video_pred_log: True
  
  deterministic_run: False
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  
  use_wandb: False
  wandb_key: None
  resume_path: null
  enable_cloud_backup: False
  cloud_backup_interval: 7200

  # ==========================================
  # 2. 模块化消融开关 (edit these or use ab_* presets below)
  # ==========================================
  # Architecture switch. All S-branch modules require module_dual_sz=true.
  module_dual_sz: false
  module_saff: false
  module_s5a: false
  module_outcome: false
  module_proto: false
  module_inverse: false
  module_z_adv: false

  # Main ablation coefficients. These are mapped onto the implementation at
  # runtime by ablation.py, so they can be changed directly from CLI.
  saff_scale: 1.0
  full_heatmap_scale: 1.0
  s5a_scale: 0.05
  outcome_scale: 0.01
  proto_scale: 0.01
  inverse_scale: 1.0
  z_adv_scale: 1.0

  # Generic Proto can also be switched to the old temporal-success labels.
  proto_label_mode: task_evidence
  # auto: Dual S/Z -> S branch; single-stream Dreamer -> full RSSM latent.
  proto_latent_source: auto

  # Actor/Critic reward shaping. Keep 1.0 to match the existing experiments;
  # set 0.0 for environment-reward-only ablations.
  intrinsic_reward_scale: 1.0

  # Effective values below are overwritten by ablation.py from the switches.
  inverse_loss_scale: 0.0      # 本消融关闭inverse监督；inverse head保留实例以维持初始化/RNG路径可比性
  affordance_s_scale: 0.0      # Affordance仅作为S分支辅助监督，不再输入encoder
  z_action_adv_scale: 0.0      # 关闭Z对抗；只测试S-Aff + S-only 5A
  z_action_grl_scale: 1.0      # Gradient Reversal强度

  # S-only Experiment 5A: multi-step open-loop consistency on controllable S branch only.
  # 与原5A保持同一 horizons / weights / scale；Z不参与该辅助损失。
  s_multi_step_consistency:
    enabled: false
    horizons: [1, 2, 4, 8, 15]
    horizon_weights: [1.0, 1.0, 0.75, 0.5, 0.25]
    projection_dim: 512
    starts_per_sequence: 4
    projection_seed: 314159
    loss_scale: 0.05

    # S-Outcome: 用同一条S5A rollout的 [S_t, S_hat_{t+k}] 预测真实环境
    # k-step discounted return。只作为world-model辅助监督，不加入Actor reward。
    outcome:
      enabled: false
      loss_scale: 0.01
      hidden_dim: 256
      init_seed: 161803
      # 省略/设为null时由代码继承全局 discount=0.997；这里显式写出便于审计。
      discount: 0.997

      # Balanced Multi-Step Return Prediction
      # 原始Outcome中非零真实回报极稀疏（约1e-3量级），普通MSE容易退化为“全预测0”。
      # balanced模式分别求正/负样本均值，再按positive_mix混合；只有一类样本时退化为该类均值。
      balance_mode: balanced
      positive_mix: 0.5
      positive_threshold: 1.0e-6
      # 仅用于legacy sample_weighted模式；balanced模式下不使用。
      positive_weight: 1.0

      # Head calibration：额外使用同一replay batch中所有合法posterior窗口，
      # 从 [S_t, S_{t+k}] 预测真实k-step return。posterior特征detach，
      # 因而该项只校准Outcome head，不向S/Z encoder或RSSM注入捷径。
      # 主rollout outcome loss仍使用 [S_t, S_hat_{t+k}]，并继续向S dynamics反传。
      calibration_enabled: true
      calibration_scale: 0.5

    # Generic Few-shot Prototypical Utility v2:
    # 不再按“距离成功还有4/15步”做任务特定的时间分层。默认使用所有任务都存在的
    # task-conditioned evidence：MineCLIP task score + affordance heatmap + 少量 intrinsic
    # progress event，经过 batch 内稳健分位数归一化后形成 Low/Mid/High/Success 四类。
    # real environment reward 只负责 Success 硬锚点。仍然只作为 representation
    # supervision，不加入 Actor imagined reward，因此 RGB-only inference 不变。
    prototype_utility:
      enabled: false
      loss_scale: 0.01
      temperature: 0.10
      prototype_ema: 0.95

      # task_evidence = 默认通用版；temporal_success = 旧版时间分层，仅供消融。
      label_mode: task_evidence

      # 通用 teacher 权重。task_score 和 heatmap 都是 task-conditioned，
      # 数值会先在每个 replay batch 内做稳健分位数归一化，因此不需要为每个任务手调阈值。
      semantic_weight: 0.65
      affordance_weight: 0.30
      intrinsic_weight: 0.05
      heatmap_topk_fraction: 0.05

      # robust component normalization: q05 -> 0, q95 -> 1
      robust_low_quantile: 0.05
      robust_high_quantile: 0.95

      # combined task evidence 的三段相对分层：Low / Mid / High。
      # 边界附近留作 Unknown，降低 noisy pseudo labels。
      stage_low_quantile: 0.30
      stage_high_quantile: 0.70
      boundary_margin: 0.05
      min_signal_span: 1.0e-4

      # 真实成功永远覆盖 pseudo stage，成为 class 3 的硬锚点。
      positive_threshold: 1.0e-6

      # 下面三个参数仅 label_mode=temporal_success 时使用。
      ready_steps: 4
      near_steps: 15
      progress_steps: null

    # 仅诊断，不加入 total_loss，不反传梯度，也不改变随机数流。
    diagnostics:
      enabled: true
      counterfactual_actions: true      # true prefix vs cyclic-shuffled / zero prefix
      direct_vs_composed: true          # ISO3 surrogate: full open-loop vs posterior-reanchored terminal
      direct_vs_composed_horizon: 15
      direct_vs_composed_midpoint: 7
  # 【已移除 long_term_branch_weight】

  gaussian_reward_weight: 0.0  
  gaussian_sigma_weight: 0.5   

  # ==========================================
  # 3. 强化学习与训练超参 (RL & Training Params)
  # ==========================================
  steps: 1e6                   
  parallel: False
  eval_every: 20000            
  eval_episode_num: 10          # 减少3-episode评估造成的离散高方差
  log_every: 20000
  reset_every: 0
  train_ratio: 16              
  pretrain: 100                
  prefill: 2500                
  dataset_size: 1000000
  batch_size: 16
  batch_length: 32
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  opt: 'adam'
  reward_EMA: True             

  # ==========================================
  # 4. 环境设置 (Environment)
  # ==========================================
  task: 'minedojo'
  size: [64, 64]
  envs: 1
  action_repeat: 1
  time_limit: 36000
  grayscale: False
  break_speed: 100.0

  # ==========================================
  # 5. 行为策略与长短期想象 (Behavior & Imagination)
  # ==========================================
  discount: 0.997
  discount_lambda: 0.95
  # 【已移除 jump_prob 和 jump_prob_decay】
  imag_horizon: 15             
  max_imag_sequences_num: 1024
  imag_gradient: 'reinforce'   
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # ==========================================
  # 6. 世界模型架构 (World Model Architecture)
  # ==========================================
  dyn_hidden: 1024
  dyn_deter: 4096
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  units: 1024
  act: 'SiLU'
  norm: True
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  img_weight: 1.0
  jmp_weight: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'
  
  encoder:
    {mlp_keys: '$^', cnn_keys: '^image$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: '^image$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  
  # 【已移除 'jump', 'jumping_steps', 'accumulated_reward'】
  grad_heads: ['decoder', 'reward', 'end', 'intrinsic']

  # ==========================================
  # 7. 策略与价值网络 (Actor-Critic & Heads)
  # ==========================================
  actor:
    {layers: 5, dist: 'onehot', entropy: 3e-4, unimix_ratio: 0.01, std: 'none', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic: 
    {layers: 5, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  
  reward_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  end_head: {layers: 5, loss_scale: 1.0, outscale: 1.0}
  intrinsic_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  # 【已移除 jump_head, jumping_steps_head, accumulated_reward_head, concentration_score_head】

  # ==========================================
  # 8. 探索参数 (Exploration)
  # ==========================================
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

minedojo:
  target_item: "log"
  name: "test"
  results_dir: "./results"
  agent_checkpoint_dir: ""
  unet_batch_size: 64
  rollout_image_num: 2000
  is_random: True

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20

# ============================================================
# Named ablation presets
# Usage:
#   python expr.py --configs minedojo ab_dreamer --task minedojo_harvest_log_in_plains --logdir ./logdir
# or:
#   bash ./scripts/train_ablation.sh harvest_log_in_plains ab_dreamer 0
#
# IMPORTANT:
# S-Aff / S5A / Outcome / Proto operate on the S branch and therefore include
# Dual S/Z. "ab_saff" means Dreamer + Dual S/Z + S-Aff, not S-Aff on a
# single-stream RSSM.
# ============================================================

ab_dreamer:
  module_dual_sz: false
  module_saff: false
  module_s5a: false
  module_outcome: false
  module_proto: false
  module_inverse: false
  module_z_adv: false

ab_dreamer_no_intrinsic:
  module_dual_sz: false
  module_saff: false
  module_s5a: false
  module_outcome: false
  module_proto: false
  module_inverse: false
  module_z_adv: false
  intrinsic_reward_scale: 0.0

ab_dual:
  module_dual_sz: true
  module_saff: false
  module_s5a: false
  module_outcome: false
  module_proto: false
  module_inverse: false
  module_z_adv: false

# Single-module ablations on top of the required Dual S/Z backbone.
ab_saff:
  module_dual_sz: true
  module_saff: true
  module_s5a: false
  module_outcome: false
  module_proto: false

ab_s5a:
  module_dual_sz: true
  module_saff: false
  module_s5a: true
  module_outcome: false
  module_proto: false

ab_outcome:
  module_dual_sz: true
  module_saff: false
  module_s5a: false
  module_outcome: true
  module_proto: false

ab_proto:
  # Backward-compatible name: Dreamer + Dual S/Z + Generic Proto on S.
  module_dual_sz: true
  module_saff: false
  module_s5a: false
  module_outcome: false
  module_proto: true
  proto_latent_source: s

# Key controlled ablation requested by the user:
# ordinary single-stream Dreamer + the SAME Generic Task-Evidence ProtoNet,
# applied to the standard Dreamer full RSSM latent instead of S.
ab_dreamer_proto:
  module_dual_sz: false
  module_saff: false
  module_s5a: false
  module_outcome: false
  module_proto: true
  module_inverse: false
  module_z_adv: false
  proto_latent_source: full
  proto_scale: 0.01

# Explicit alias for the Dual/S counterpart in the 2x2 ablation.
ab_dual_proto:
  module_dual_sz: true
  module_saff: false
  module_s5a: false
  module_outcome: false
  module_proto: true
  module_inverse: false
  module_z_adv: false
  proto_latent_source: s
  proto_scale: 0.01

# Cumulative ablations matching the current method-development chain.
ab_saff_s5a:
  module_dual_sz: true
  module_saff: true
  module_s5a: true
  module_outcome: false
  module_proto: false

ab_saff_s5a_outcome:
  module_dual_sz: true
  module_saff: true
  module_s5a: true
  module_outcome: true
  module_proto: false

ab_saff_s5a_proto:
  module_dual_sz: true
  module_saff: true
  module_s5a: true
  module_outcome: false
  module_proto: true

ab_full:
  module_dual_sz: true
  module_saff: true
  module_s5a: true
  module_outcome: true
  module_proto: true

# Useful sensitivity presets.
ab_full_proto_half:
  module_dual_sz: true
  module_saff: true
  module_s5a: true
  module_outcome: true
  module_proto: true
  proto_scale: 0.005

ab_full_no_intrinsic:
  module_dual_sz: true
  module_saff: true
  module_s5a: true
  module_outcome: true
  module_proto: true
  intrinsic_reward_scale: 0.0

# Optional legacy modules retained for dedicated ablations.
ab_inverse:
  module_dual_sz: true
  module_inverse: true

ab_z_adv:
  module_dual_sz: true
  module_z_adv: true

