defaults:

  use_wandb: False
  wandb_key: None
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  deterministic_run: False
  steps: 1e6
  parallel: False
  eval_every: 20000
  eval_episode_num: 10
  log_every: 20000
  reset_every: 0
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  video_pred_log: True

  # Experiment 5A is enabled by the `multistep5a` profile.
  multi_step_consistency:
    enabled: false
    horizons: [1, 2, 4, 8, 15]
    horizon_weights: [1.0, 1.0, 0.75, 0.5, 0.25]
    projection_dim: 512
    starts_per_sequence: 4
    projection_seed: 314159
    loss_scale: 0.05

  # Experiment 5D: result-aware multi-step latent dynamics.
  # Disabled by default; enabled by the `outcomeaware5d` profile.
  outcome_aware_multistep:
    enabled: false
    horizons: [1, 2, 4, 8, 15]
    horizon_weights: [0.25, 0.5, 0.75, 1.0, 1.0]
    projection_dim: 512
    starts_per_sequence: 4
    projection_seed: 314159
    discount: 0.997

    # Component scales are internal to this objective.
    absolute_loss_scale: 0.005
    delta_loss_scale: 0.020
    return_loss_scale: 0.010
    return_rank_loss_scale: 0.005
    action_margin_loss_scale: 0.005

    # Conservative real-vs-shuffled action ranking.
    action_margin: 0.10
    action_negative_stop_gradient: true
    compute_action_gap: true

    # Deterministic auxiliary rollout avoids consuming the global RNG.
    rollout_sample: false
    detach_start_state: true
    delta_min_norm: 1.0e-4

    # Cumulative reward consistency and scale-free return weighting/ranking.
    return_huber_delta: 1.0
    return_weight_bonus: 1.0
    return_weight_cap: 4.0
    ranking_epsilon: 1.0e-4
    ranking_temperature: 1.0

    # Environment-step curriculum.
    global_start_step: 50000
    global_ramp_steps: 250000
    horizon_start_steps: [50000, 50000, 50000, 150000, 300000]
    horizon_ramp_steps: [100000, 100000, 100000, 100000, 100000]

  # Environment
  task: 'minedojo'
  size: [64, 64]
  envs: 1
  action_repeat: 1
  time_limit: 1000
  grayscale: False
  prefill: 2500
  reward_EMA: True

  # Model
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  #修改 grad_heads：将末尾的 3 个跳跃头删掉。
  #grad_heads: ['decoder', 'reward', 'end', 'intrinsic', 'jump', 'jumping_steps', 'accumulated_reward']
  grad_heads: ['decoder', 'reward', 'end']
  units: 512
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 3e-4, unimix_ratio: 0.01, std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  end_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  #jump_head:
   # {layers: 2, loss_scale: 1.0, outscale: 1.0}
  #concentration_score_head:
   # {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  intrinsic_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  #jumping_steps_head:
   # {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  #accumulated_reward_head:
  #  {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  #img_weight: 1.0
  #jmp_weight: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  # Training
  batch_size: 16
  batch_length: 32
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1000000
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  #jump_prob: 0.7
  #jump_prob_decay: 0.9997
  imag_horizon: 15
  max_imag_sequences_num: 1024
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

minedojo:

  #long_term_branch_weight: 1.0
  #gaussian_reward_weight: 1.0
  #gaussian_sigma_weight: 0.5

  # rollout
  is_random: True
  agent_checkpoint_dir: ""
  rollout_image_num: 2000

  #unet_batch_size: 64
  results_dir: "./results"
  name: "test"
  target_item: "log"
  steps: 1e6
  parallel: False
  envs: 1
  eval_episode_num: 3
  eval_every: 10000
  action_repeat: 1
  train_ratio: 16
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: 'image', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  intrinsic_head: {layers: 5}
  #jumping_steps_head: {layers: 5}
  #accumulated_reward_head: {layers: 5}
  end_head: {layers: 5}
  #jump_head: {layers: 5}
  imag_gradient: 'reinforce'
  break_speed: 100.0
  time_limit: 36000

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20

# Experiment 5A: Open-loop Multi-step RSSM Consistency
multistep5a:
  logdir: ./logdir_multistep5a
  multi_step_consistency:
    enabled: true
    horizons: [1, 2, 4, 8, 15]
    horizon_weights: [1.0, 1.0, 0.75, 0.5, 0.25]
    projection_dim: 512
    starts_per_sequence: 4
    projection_seed: 314159
    loss_scale: 0.05

# Experiment 5D: Outcome-Aware Multi-Step RSSM Dynamics.
# The original 5A objective is disabled to avoid double-counting absolute
# consistency; 5D contains a weaker absolute term internally.
outcomeaware5d:
  logdir: ./logdir_outcomeaware5d
  multi_step_consistency:
    enabled: false
  outcome_aware_multistep:
    enabled: true
    horizons: [1, 2, 4, 8, 15]
    horizon_weights: [0.25, 0.5, 0.75, 1.0, 1.0]
    projection_dim: 512
    starts_per_sequence: 4
    projection_seed: 314159
    discount: 0.997
    absolute_loss_scale: 0.005
    delta_loss_scale: 0.020
    return_loss_scale: 0.010
    return_rank_loss_scale: 0.005
    action_margin_loss_scale: 0.005
    action_margin: 0.10
    action_negative_stop_gradient: true
    compute_action_gap: true
    rollout_sample: false
    detach_start_state: true
    delta_min_norm: 1.0e-4
    return_huber_delta: 1.0
    return_weight_bonus: 1.0
    return_weight_cap: 4.0
    ranking_epsilon: 1.0e-4
    ranking_temperature: 1.0
    global_start_step: 50000
    global_ramp_steps: 250000
    horizon_start_steps: [50000, 50000, 50000, 150000, 300000]
    horizon_ramp_steps: [100000, 100000, 100000, 100000, 100000]

# Structural ablation: removes action-margin training but still logs action gap.
outcomeaware5d_nomargin:
  logdir: ./logdir_outcomeaware5d_nomargin
  multi_step_consistency:
    enabled: false
  outcome_aware_multistep:
    enabled: true
    action_margin_loss_scale: 0.0
    compute_action_gap: true

# Structural ablation: no return ranking, retaining scalar return consistency.
outcomeaware5d_norank:
  logdir: ./logdir_outcomeaware5d_norank
  multi_step_consistency:
    enabled: false
  outcome_aware_multistep:
    enabled: true
    return_rank_loss_scale: 0.0

# Mechanism ablation: dynamics consistency only, without outcome supervision.
outcomeaware5d_noreturn:
  logdir: ./logdir_outcomeaware5d_noreturn
  multi_step_consistency:
    enabled: false
  outcome_aware_multistep:
    enabled: true
    return_loss_scale: 0.0
    return_rank_loss_scale: 0.0

