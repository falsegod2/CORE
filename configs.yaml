defaults:
  # ==========================================
  # 1. 系统与日志配置 (System & Logging)
  # ==========================================
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0

  video_pred_log: True
  
  deterministic_run: False
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  
  use_wandb: False
  wandb_key: None
  resume_path: null
  enable_cloud_backup: False
  cloud_backup_interval: 7200

  # ==========================================
  # 2. 核心创新点与消融实验控制 (CJJ Innovations)
  # ==========================================
  inverse_loss_scale: 1.0         # 创新1：S分支逆动力学约束权重
  affordance_s_scale: 2.0         # 创新2：S分支可供性地图(Heatmap)对齐约束权重
  intrinsic_reward_scale: 1.0     # 创新3：MineCLIP语义奖励给Manager的权重
  # 【已移除 long_term_branch_weight】

  gaussian_reward_weight: 0.0  
  gaussian_sigma_weight: 0.5   

  # ==========================================
  # 3. 强化学习与训练超参 (RL & Training Params)
  # ==========================================
  steps: 1e6                   
  parallel: False
  eval_every: 10000            
  eval_episode_num: 3
  log_every: 20000
  reset_every: 0
  train_ratio: 16              
  pretrain: 100                
  prefill: 2500                
  dataset_size: 1000000
  batch_size: 16
  batch_length: 32
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  opt: 'adam'
  reward_EMA: True             

  # ==========================================
  # 4. 环境设置 (Environment)
  # ==========================================
  task: 'minedojo'
  size: [64, 64]
  envs: 1
  action_repeat: 1
  time_limit: 36000
  grayscale: False
  break_speed: 100.0

  # ==========================================
  # 5. 行为策略与长短期想象 (Behavior & Imagination)
  # ==========================================
  discount: 0.997
  discount_lambda: 0.95
  # 【已移除 jump_prob 和 jump_prob_decay】
  imag_horizon: 15             
  max_imag_sequences_num: 1024
  imag_gradient: 'reinforce'   
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # ==========================================
  # 6. 世界模型架构 (World Model Architecture)
  # ==========================================
  dyn_hidden: 1024
  dyn_deter: 4096
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  units: 1024
  act: 'SiLU'
  norm: True
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  img_weight: 1.0
  jmp_weight: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'
  
  encoder:
    {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward', cnn_keys: '^(image|heatmap)$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: '^(image|heatmap)$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  
  # 【已移除 'jump', 'jumping_steps', 'accumulated_reward'】
  grad_heads: ['decoder', 'reward', 'end', 'intrinsic']

  # ==========================================
  # 7. 策略与价值网络 (Actor-Critic & Heads)
  # ==========================================
  # 【新增】Manager 的配置：输出连续的相对隐状态偏移量 \Delta S
  manager_freq: 10   # K=10，每 10 步 Manager 下达一次新地标
  manager:
    {layers: 5, dist: 'trunc_normal', std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0, unimix_ratio: 0.01}
  
  # 【修改】Worker (Actor) 需要扩大输入维度，但配置参数本身不用大改
  actor:
    {layers: 5, dist: 'onehot', entropy: 3e-4, unimix_ratio: 0.01, std: 'none', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic: 
    {layers: 5, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  
  reward_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  end_head: {layers: 5, loss_scale: 1.0, outscale: 1.0}
  intrinsic_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  # 【已移除 jump_head, jumping_steps_head, accumulated_reward_head, concentration_score_head】

  # ==========================================
  # 8. 探索参数 (Exploration)
  # ==========================================
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

minedojo:
  target_item: "log"
  name: "test"
  results_dir: "./results"
  agent_checkpoint_dir: ""
  unet_batch_size: 64
  rollout_image_num: 2000
  is_random: True

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20