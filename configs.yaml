defaults:
  # System and logging
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  video_pred_log: True
  deterministic_run: False
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  use_wandb: False
  wandb_key: null
  enable_cloud_backup: False
  cloud_backup_interval: 7200

  # Training
  steps: 1e6
  parallel: False
  eval_every: 10000
  eval_episode_num: 3
  log_every: 20000
  reset_every: 0
  train_ratio: 16
  pretrain: 100
  prefill: 2500
  dataset_size: 1000000
  batch_size: 16
  batch_length: 32
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  opt: 'adam'
  reward_EMA: True

  # Environment
  task: 'minedojo'
  envs: 1
  action_repeat: 1
  time_limit: 36000

  # Standard DreamerV3 latent imagination
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  imag_gradient: 'reinforce'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Reward used by actor-critic: environment + scaled MineCLIP
  mineclip_reward_scale: 1.0

  # Standard single-stream DreamerV3 world model
  dyn_hidden: 1024
  dyn_deter: 4096
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  units: 1024
  act: 'SiLU'
  norm: True
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  encoder:
    {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward', cnn_keys: '^image$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}

  # Task-relevant object tokens. Frozen MineCLIP text and the already-computed
  # global video embedding condition candidate selection and object queries.
  # The global feature is a detached semantic teacher/condition, not a direct
  # RSSM input. No pure Slot Attention, heatmap, or extra reward is introduced.
  task_object_tokens:
    enabled: true
    task_key: 'task_embedding'
    task_dim: 512
    visual_key: 'mineclip_embedding'
    visual_dim: 512
    object_dim: 256
    hidden: 256
    num_objects: 4
    candidate_topk: 8
    object_iters: 2
    relevance_temperature: 0.2
    attention_temperature: 0.5
    relevance_bias: 2.0
    normalize_task: true
    residual_scale: 0.05
    output_init: 0.001
    coverage_scale: 0.02
    diversity_scale: 0.005
    semantic_align_scale: 0.02
  decoder:
    {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: '^image$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}

  grad_heads: ['decoder', 'reward', 'end', 'mineclip_reward']

  actor:
    {layers: 5, dist: 'onehot', entropy: 3e-4, unimix_ratio: 0.01, std: 'none', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 5, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  end_head: {layers: 5, loss_scale: 1.0, outscale: 1.0}
  mineclip_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}

  # Optional Plan2Explore settings
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

minedojo:
  target_item: 'log'
  name: 'test'
  results_dir: './results'
  agent_checkpoint_dir: ''
  rollout_image_num: 2000
  is_random: True

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
