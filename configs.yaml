defaults:
  # System and logging
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  video_pred_log: True
  deterministic_run: False
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  use_wandb: False
  wandb_key: null
  enable_cloud_backup: False
  cloud_backup_interval: 7200

  # Training
  steps: 1e6
  parallel: False
  eval_every: 20000
  eval_episode_num: 10
  log_every: 20000
  reset_every: 0
  train_ratio: 16
  pretrain: 100
  prefill: 2500
  dataset_size: 1000000
  batch_size: 16
  batch_length: 32
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  opt: 'adam'
  reward_EMA: True

  # Detached Dreamer baseline diagnostics. These never enter training losses.
  dreamer_diagnostics:
    enabled: True
    every: 16
    horizons: [1, 2, 4, 8, 15]
    starts_per_sequence: 4
    projection_dim: 512
    projection_seed: 314159
    task_probe: True

  # Environment
  task: 'minedojo'
  envs: 1
  action_repeat: 1
  time_limit: 36000

  # Standard DreamerV3 latent imagination
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  imag_gradient: 'reinforce'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Reward used by actor-critic: environment + scaled MineCLIP
  mineclip_reward_scale: 1.0

  # Standard single-stream DreamerV3 world model
  dyn_hidden: 1024
  dyn_deter: 4096
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  units: 1024
  act: 'SiLU'
  norm: True
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  encoder:
    {mlp_keys: '$^', cnn_keys: '^image$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: '^image$', act: 'SiLU', norm: True, cnn_depth: 96, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}

  grad_heads: ['decoder', 'reward', 'end', 'mineclip_reward']

  actor:
    {layers: 5, dist: 'onehot', entropy: 3e-4, unimix_ratio: 0.01, std: 'none', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 5, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  end_head: {layers: 5, loss_scale: 1.0, outscale: 1.0}
  mineclip_head: {layers: 5, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}

  # Optional Plan2Explore settings
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

minedojo:
  target_item: 'log'
  name: 'test'
  results_dir: './results'
  agent_checkpoint_dir: ''
  rollout_image_num: 2000
  is_random: True


# ViZDoom pixel-only profile. Select scenarios through --task vizdoom_<name>.
# MineCLIP remains structurally present in this clean baseline implementation,
# but both its model-loss scale and actor-reward scale are zero here.
vizdoom:
  task: 'vizdoom_my_way_home'
  name: 'dreamerv3_vizdoom'
  results_dir: './results'
  action_repeat: 1

  # ViZDoom adapter
  vizdoom_image_size: 64
  vizdoom_frame_skip: 4
  vizdoom_reward_mode: 'native'  # native | sparse_success
  vizdoom_success_threshold: -1.0  # <0 => task-specific automatic threshold
  vizdoom_render: False
  # RGB teacher is stored only for detached task-relevance diagnostics.
  # It is excluded from Dreamer's encoder/decoder by the ^image$ regex.
  vizdoom_diagnostic_teacher_mode: 'auto'  # auto | green_goal | moving_target | none

  # Pure environment-reward DreamerV3 in ViZDoom.
  mineclip_reward_scale: 0.0
  grad_heads: ['decoder', 'reward', 'end']
  mineclip_head:
    loss_scale: 0.0

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
