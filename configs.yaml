defaults:
  # ===== Basic =====
  use_wandb: False
  wandb_key: None
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  deterministic_run: False
  steps: 1000000
  parallel: False
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  video_pred_log: True

  # ===== Environment: MineDojo only =====
  task: 'minedojo'
  size: [64, 64]
  envs: 1
  action_repeat: 1
  time_limit: 36000
  grayscale: False
  prefill: 2500
  reward_EMA: True
  eval_every: 10000
  eval_episode_num: 3
  log_every: 20000
  reset_every: 0

  # ===== MineDojo rollout / affordance map dataset =====
  is_random: True
  agent_checkpoint_dir: ''
  rollout_image_num: 2000
  results_dir: './results'
  name: 'test'
  target_item: 'log'
  break_speed: 100.0

  # ===== RSSM / World Model =====
  dyn_hidden: 1024
  dyn_deter: 4096
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  units: 1024
  act: 'SiLU'
  norm: True
  grad_heads: ['decoder', 'reward', 'end']

  encoder:
    mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward'
    cnn_keys: 'image'
    act: 'SiLU'
    norm: True
    cnn_depth: 96
    kernel_size: 4
    minres: 4
    mlp_layers: 5
    mlp_units: 1024
    symlog_inputs: True

    # AGOC object-centric encoder
    use_slots: True
    num_slots: 8
    slot_dim: 128
    slot_iters: 3
    slot_use_coords: True

    # Affordance-only object selection. No task_scores.
    affordance_keys: 'heatmap'
    task_embed_keys: '__no_task_embed__'
    task_embed_dim: 512
    affordance_bias: 1.0
    tao_include_flat: True
    tao_include_global: True
    tao_include_affordance: True
    tao_include_task: False
    tao_affordance_weight: 1.0
    tao_task_weight: 0.0
    tao_temperature: 1.0

  decoder:
    mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath'
    cnn_keys: 'image|heatmap'
    act: 'SiLU'
    norm: True
    cnn_depth: 96
    kernel_size: 4
    minres: 4
    mlp_layers: 5
    mlp_units: 1024
    cnn_sigmoid: False
    image_dist: mse
    vector_dist: symlog_mse
    outscale: 1.0

  reward_head:
    layers: 5
    dist: 'symlog_disc'
    loss_scale: 1.0
    outscale: 0.0

  end_head:
    layers: 5
    loss_scale: 1.0
    outscale: 1.0

  # Kept for compatibility with codebases that still read config.value.
  # If your code only uses config.critic, this block is ignored.
  value:
    layers: 5

  actor:
    layers: 5
    dist: 'onehot'
    entropy: 3e-4
    unimix_ratio: 0.01
    std: 'none'
    min_std: 0.1
    max_std: 1.0
    temp: 0.1
    lr: 3e-5
    eps: 1e-5
    grad_clip: 100.0
    outscale: 1.0

  critic:
    layers: 5
    dist: 'symlog_disc'
    slow_target: True
    slow_target_update: 1
    slow_target_fraction: 0.02
    lr: 3e-5
    eps: 1e-5
    grad_clip: 100.0
    outscale: 0.0

  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  # ===== Training =====
  batch_size: 16
  batch_length: 32
  train_ratio: 16
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1000000
  opt: 'adam'

  # AGOC representation losses
  affordance_align_scale: 0.3
  slot_diversity_scale: 0.03
  tao_entropy_scale: 0.0

  # Dyn-O style shared object SSM auxiliary loss
  object_dyn_scale: 0.1
  object_dyn_aff_weight: 1.5
  object_dyn_match_temp: 0.2
  object_dyn_hidden: 256
  object_dyn_heads: 4
  object_dyn_layers: 1

  # ===== Behavior Learning =====
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  max_imag_sequences_num: 1024
  imag_gradient: 'reinforce'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # ===== Exploration =====
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

# The training code usually loads defaults and then updates with the selected task.
# Since this project only uses MineDojo, all active settings are already in defaults.
minedojo: {}

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
