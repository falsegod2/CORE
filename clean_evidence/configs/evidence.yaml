model:
  dyn_deter: 4096
  dyn_hidden: 1024
  dyn_stoch: 32
  dyn_discrete: 32
  units: 1024
  precision: 32
  compile: false
  imag_horizon: 15
  model_lr: 0.0001
  grad_clip: 1000
  imag_gradient: reinforce
  reward_EMA: true
  encoder:
    cnn_keys: image
    mlp_keys: $^
    cnn_depth: 96
    mlp_layers: 5
    mlp_units: 1024
  decoder:
    cnn_keys: image
    mlp_keys: $^
    cnn_depth: 96
    mlp_layers: 5
    mlp_units: 1024
  actor:
    layers: 5
    dist: onehot
    std: none
    lr: 3e-05
  critic:
    layers: 5
    lr: 3e-05
  reward_head:
    layers: 5
  cont_head:
    layers: 5
evidence:
  memory_enabled: true
  read_mode: each_step
  memory_observations: 16
  tokens_per_observation: 4
  memory_dim: 256
  attention_heads: 4
  writer_depth: 32
  heatmap_size: 8
  burnin: 32
  local_heat_weight: 1.0
  posterior_heat_weight: 1.0
  fc_weight: 0.05
  fc_hidden_weight: 0.01
  fc_heat_weight: 1.0
  rc_weight: 0.01
  task_reward_weight: 1.0
  clip_reward_weight: 1.0
  clip_scale: 1.0
  horizons:
  - 1
  - 2
  - 4
  - 8
  - 15
  horizon_weights:
  - 1.0
  - 1.0
  - 0.75
  - 0.5
  - 0.25
  starts_per_sequence: 4
  mc_samples: 2
  freeze_rc_reward_head: true
